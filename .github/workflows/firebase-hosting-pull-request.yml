name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.1'
          channel: 'stable'
      # VSCode: The following secret is set in GitHub repo settings.
      # The 'Context access might be invalid' warning can be ignored.
      # There is currently no way for VSCode to verify this secret exists in GitHub without disabling all linting for the file.
      - name: Write .env file from GitHub Secrets
        run: echo "WEB_CLIENT_ID=${{ secrets.WEB_CLIENT_ID }}" > .env
      - run: flutter build web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FLUTTER_BBALL_APP }}
          projectId: flutter-bball-app
