# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # .env.public must be created before the flutter-action step so that it exists once
      # flutter pub get is run
      - name: Write .env.public file from GitHub Secrets
        run: echo "WEB_CLIENT_ID=${{ secrets.WEB_CLIENT_ID }}" > .env.public
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.1'
          channel: 'stable'
      - run: flutter build web
      - name: List build/web/assets directory
        run: ls -l build/web/assets
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FLUTTER_BBALL_APP }}
          projectId: flutter-bball-app
